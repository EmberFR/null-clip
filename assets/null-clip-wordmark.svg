<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="840" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0f14"/>
      <stop offset="100%" stop-color="#131620"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="840" height="200" rx="28" fill="url(#bgGrad)" stroke="#232734" stroke-width="2"/>

  <!-- Icon Badge -->
  <g transform="translate(155, 36)">
    <rect width="128" height="128" rx="30" fill="#161922" stroke="url(#accentGrad)" stroke-width="4"/>
    <circle cx="64" cy="64" r="34" fill="none" stroke="#5865F2" stroke-width="9"/>
    <circle cx="64" cy="64" r="14" fill="#10B981" filter="url(#glow)"/>
    <circle cx="92" cy="36" r="5" fill="#EF4444"/>
  </g>

  <!-- Wordmark Text -->
  <text x="312" y="114" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="800" letter-spacing="-2.5" fill="#F3F4F6">
    null<tspan fill="#5865F2">-</tspan>clip
  </text>

  <!-- Version / Architecture Sub-label -->
  <rect x="615" y="76" width="84" height="30" rx="8" fill="#1A1E29" stroke="#2E3446" stroke-width="1.5"/>
  <text x="657" y="96" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="700" fill="#10B981">
    v1.0.0
  </text>
</svg>
